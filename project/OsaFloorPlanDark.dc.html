<body>
<x-dc>
<helmet>
<script src="./osa-data.js"></script>

</helmet>
<div style="position:relative;width:1480px;height:1000px;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','SF Pro',system-ui,sans-serif;user-select:none">

  <div style="position:absolute;left:1220px;top:125px;width:160px;height:160px;border-radius:50%;box-sizing:border-box;border:1.5px dashed #F2995E;background:rgba(242,153,94,0.10)"></div>
  <div style="position:absolute;left:1130px;top:292px;transform:translateX(-50%);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','SF Pro',system-ui,sans-serif;font-weight:600;letter-spacing:-0.02em;font-size:24px;color:#A8A8A8;white-space:nowrap">River terrace</div>

  <div style="position:absolute;left:40px;top:60px;width:820px;height:640px;box-sizing:border-box;background:#2B2B2B;border:8px solid #A8A8A8"></div>
  <div style="position:absolute;left:420px;top:60px;width:80px;height:8px;background:#2B2B2B"></div>
  <div style="position:absolute;left:420px;top:68px;width:40px;height:40px;box-sizing:border-box;border-right:1px dashed #808080;border-bottom:1px dashed #808080;border-radius:0 0 40px 0"></div>
  <div style="position:absolute;left:460px;top:68px;width:40px;height:40px;box-sizing:border-box;border-left:1px dashed #808080;border-bottom:1px dashed #808080;border-radius:0 0 0 40px"></div>
  <div style="position:absolute;left:280px;top:692px;width:572px;height:8px;background:repeating-linear-gradient(90deg,#454545 0 110px,#A8A8A8 110px 114px)"></div>
  <div style="position:absolute;left:852px;top:560px;width:8px;height:100px;background:#454545"></div>

  <div style="position:absolute;left:48px;top:68px;width:212px;height:162px;box-sizing:border-box;background:repeating-linear-gradient(45deg,#2B2B2B 0 6px,#2B2B2B 6px 12px);border-right:4px solid #A8A8A8;border-bottom:4px solid #A8A8A8;display:flex;align-items:center;justify-content:center">
    <div style="font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#808080;background:#2B2B2B;padding:4px 8px;border-radius:4px">Kitchen</div>
  </div>
  <div style="position:absolute;left:48px;top:250px;width:216px;height:270px;box-sizing:border-box;border:4px solid #A8A8A8;border-left:none"></div>
  <div style="position:absolute;left:260px;top:350px;width:4px;height:70px;background:#2B2B2B"></div>
  <div style="position:absolute;left:64px;top:262px;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#808080">Private room</div>
  <div style="position:absolute;left:48px;top:540px;width:216px;height:152px;box-sizing:border-box;border-top:3px solid #454545;border-right:3px solid #454545;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:0 22px">
    <div style="font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#808080">Wine cellar</div>
    <div style="height:6px;border-radius:3px;background:#2B2B2B"></div>
    <div style="height:6px;border-radius:3px;background:#2B2B2B"></div>
    <div style="height:6px;border-radius:3px;background:#2B2B2B"></div>
  </div>
  <div style="position:absolute;left:588px;top:68px;width:264px;height:22px;background:#2B2B2B;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#808080">Bar</div>
  <div style="position:absolute;left:588px;top:110px;width:264px;height:30px;box-sizing:border-box;border-radius:6px;background:#401A0A;border-bottom:3px solid #F2995E"></div>
  <div style="position:absolute;left:516px;top:84px;width:46px;height:20px;border-radius:4px;background:#2B2B2B;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;letter-spacing:.14em;color:#808080">HOST</div>
  <div style="position:absolute;left:278px;top:80px;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,#5E5E5E 0 34%,#454545 35%)"></div>
  <div style="position:absolute;left:372px;top:80px;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle,#5E5E5E 0 34%,#454545 35%)"></div>
  <div style="position:absolute;left:820px;top:530px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle,#5E5E5E 0 34%,#454545 35%)"></div>
  <div style="position:absolute;left:300px;top:196px;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','SF Pro',system-ui,sans-serif;font-weight:600;letter-spacing:-0.02em;font-size:24px;color:#A8A8A8;white-space:nowrap">Dining room</div>

  <sc-for list="{{ tables }}" as="t" hint-placeholder-count="0">
    <div style="position:absolute;left:{{ t.L }}px;top:{{ t.T }}px;width:{{ t.W }}px;height:{{ t.H }}px;opacity:{{ t.op }};cursor:{{ t.cursor }};transition:opacity .25s" onClick="{{ t.onClick }}" onMouseEnter="{{ t.onEnter }}" onMouseLeave="{{ t.onLeave }}">
      <sc-for list="{{ t.chairs }}" as="c" hint-placeholder-count="0">
        <div style="position:absolute;left:{{ c.x }}px;top:{{ c.y }}px;width:{{ c.w }}px;height:{{ c.h }}px;border-radius:{{ c.r }}px;transform:rotate({{ c.rot }}deg);background:{{ c.bg }};border:{{ c.bd }};box-sizing:border-box;transition:background .2s"></div>
      </sc-for>
      <div style="position:absolute;left:{{ t.pad }}px;top:{{ t.pad }}px;width:{{ t.w }}px;height:{{ t.h }}px;border-radius:{{ t.rad }};background:{{ t.fill }};border:{{ t.border }};box-shadow:{{ t.shadow }};box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','SF Pro',system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:{{ t.fs }}px;font-weight:500;color:{{ t.ink }};transition:background .2s,box-shadow .2s">{{ t.code }}</div>
    </div>
  </sc-for>

  <sc-if value="{{ tip.show }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:{{ tip.x }}px;top:{{ tip.y }}px;transform:translate(-50%,-100%);background:{{ tip.bg }};color:{{ tip.fg }};border-radius:10px;padding:8px 12px;font-size:14px;font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:8px;pointer-events:none">
      <span style="font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','SF Pro',system-ui,sans-serif;font-variant-numeric:tabular-nums;font-weight:500">{{ tip.code }}</span>
      <span style="opacity:.55">·</span>
      <span style="font-family:{{ tip.ff }};font-size:{{ tip.fs }}px;line-height:1">{{ tip.text }}</span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1480,&quot;height&quot;:1000},&quot;guests&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;tsType&quot;:&quot;number&quot;},&quot;area&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;indoor&quot;,&quot;outdoor&quot;],&quot;default&quot;:&quot;indoor&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;time&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;7:30 pm&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;selected&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hover&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;focus&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;flag&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onPick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(code:string)=&gt;void&quot;},&quot;onHover&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(code:string|null)=&gt;void&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    if (!window.OSA_DATA) this._iv = setInterval(() => { if (window.OSA_DATA) { clearInterval(this._iv); this.forceUpdate(); } }, 50);
  }
  componentWillUnmount() { clearInterval(this._iv); }
  chairs(t, pad) {
    const out = [];
    if (t.shape === 'stool') return out;
    if (t.shape === 'booth') {
      out.push({ x: pad - 5, y: pad - 20, w: t.w + 10, h: 16, r: 8, rot: 0 });
      out.push({ x: pad - 5, y: pad + t.h + 4, w: t.w + 10, h: 16, r: 8, rot: 0 });
      return out;
    }
    if (t.shape === 'round') {
      const n = t.round, R = t.w / 2 + 11;
      for (let i = 0; i < n; i++) {
        const a = -90 + 360 * i / n, rad = a * Math.PI / 180;
        const cx = pad + t.w / 2 + R * Math.cos(rad), cy = pad + t.h / 2 + R * Math.sin(rad);
        out.push({ x: cx - 13, y: cy - 6, w: 26, h: 12, r: 5, rot: a + 90 });
      }
      return out;
    }
    const c = t.chairs || {};
    for (let i = 0; i < (c.t || 0); i++) out.push({ x: pad + t.w * (i + .5) / c.t - 13, y: pad - 16, w: 26, h: 12, r: 5, rot: 0 });
    for (let i = 0; i < (c.b || 0); i++) out.push({ x: pad + t.w * (i + .5) / c.b - 13, y: pad + t.h + 4, w: 26, h: 12, r: 5, rot: 0 });
    for (let i = 0; i < (c.l || 0); i++) out.push({ x: pad - 16, y: pad + t.h * (i + .5) / c.l - 13, w: 12, h: 26, r: 5, rot: 0 });
    for (let i = 0; i < (c.r || 0); i++) out.push({ x: pad + t.w + 4, y: pad + t.h * (i + .5) / c.r - 13, w: 12, h: 26, r: 5, rot: 0 });
    return out;
  }
  renderVals() {
    const D = window.OSA_DATA;
    if (!D) return { tables: [], tip: { show: false } };
    const p = this.props;
    const guests = p.guests ?? 2, area = p.area ?? 'indoor', time = p.time ?? '7:30 pm';
    const sel = p.selected ?? null, hov = p.hover ?? null, focus = !!p.focus;
    const S = {
      available: { cb: '#913E19', cd: 'none', fill: '#401A0A', border: '1.5px solid #F2995E', ink: '#FCD8BF', shadow: 'none' },
      hover: { cb: '#DA621E', cd: 'none', fill: '#763518', border: '2px solid #F8BC92', ink: '#FFF7F1', shadow: '0 4px 14px rgba(0,0,0,0.5)' },
      selected: { cb: '#FF9A7D', cd: 'none', fill: '#F8471A', border: '2px solid #F8471A', ink: '#FFF', shadow: '0 0 0 7px rgba(248,71,26,0.3)' },
      lost: { cb: '#454545', cd: 'none', fill: '#2B2B2B', border: '2px dashed #F8471A', ink: '#F8471A', shadow: '0 0 0 7px rgba(248,71,26,0.2)' },
      booked: { cb: '#454545', cd: 'none', fill: '#2B2B2B', border: '1.5px solid #454545', ink: '#5E5E5E', shadow: 'none' },
      wrong: { cb: 'transparent', cd: '1.5px dashed #454545', fill: 'transparent', border: '1.5px dashed #808080', ink: '#808080', shadow: 'none' }
    };
    let tip = { show: false };
    const tables = D.tables.map(t => {
      const booked = D.isBooked(t.code, time);
      const fits = guests >= t.min && guests <= t.max;
      const inArea = t.area === area;
      let st;
      if (sel === t.code) st = booked ? 'lost' : 'selected';
      else if (booked) st = 'booked';
      else if (!fits) st = 'wrong';
      else if (hov === t.code && inArea) st = 'hover';
      else st = 'available';
      const s = S[st];
      const pad = t.shape === 'stool' ? 0 : 24;
      const W = t.w + 2 * pad, H = t.h + 2 * pad;
      let op = 1;
      if (!inArea) op = 0.22;
      else if (focus && sel !== t.code) op = 0.38;
      else if (st === 'wrong') op = 0.6;
      const clickable = inArea && (st === 'available' || st === 'hover' || st === 'selected') && !focus;
      if (hov === t.code && inArea) {
        tip = { show: true, code: t.code, text: t.name + ' · ' + (booked ? 'Booked' : !fits ? D.seats(t) : 'Available'), ff: 'inherit', fs: 14, bg: '#F7F7F7', fg: '#2B2B2B' };
      }
      return {
        code: t.code, L: t.x - W / 2, T: t.y - H / 2, W, H, pad, w: t.w, h: t.h,
        rad: (t.shape === 'round' || t.shape === 'stool') ? '50%' : '8px',
        fs: t.shape === 'stool' ? 10 : 13, op, cursor: clickable ? 'pointer' : 'default',
        fill: s.fill, border: s.border, ink: s.ink, shadow: s.shadow,
        chairs: this.chairs(t, pad).map(c => Object.assign(c, { bg: s.cb, bd: s.cd })),
        onClick: (e) => { if (clickable && p.onPick) { e.stopPropagation(); p.onPick(t.code); } },
        onEnter: () => p.onHover && p.onHover(t.code),
        onLeave: () => p.onHover && p.onHover(null),
        _t: t, _H: H
      };
    });
    if (tip.show) {
      const x = tables.find(r => r.code === tip.code);
      tip.x = x._t.x; tip.y = x._t.y - x._H / 2 - 6;
    } else if (p.flag && sel) {
      const x = tables.find(r => r.code === sel);
      if (x) tip = { show: true, code: sel, text: p.flag, ff: 'inherit', fs: 14, bg: '#F8471A', fg: '#FFF', x: x._t.x, y: x._t.y - x._H / 2 - 6 };
    }
    return { tables, tip };
  }
}
</script>
</body>
</html>
